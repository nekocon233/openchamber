<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remote Desktop</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--oc-background); color: var(--oc-foreground); font: 13px var(--oc-font); }
    #root { display: flex; flex-direction: column; position: relative; }
    .viewport { flex: 1; min-height: 0; min-width: 0; overflow: hidden; direction: ltr; }
    .viewport:focus-visible { outline: none; }
    .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; pointer-events: none; }
    .empty-content { max-width: 36rem; text-align: start; line-height: 1.6; color: var(--oc-muted); }
    .empty-content[data-error="true"] p:first-child { color: var(--oc-error-text); }
    .empty-content p { margin: 0 0 12px; }
    .empty-content p:last-child { margin-bottom: 0; }
    pre { margin: 0; max-width: 100%; overflow: auto; color: var(--oc-foreground); font: 12px/1.6 var(--oc-mono); white-space: pre-wrap; overflow-wrap: anywhere; pointer-events: auto; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./main.js"></script>
</body>
</html>
